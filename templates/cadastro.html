{% extends "base.html" %}

{% block conteudo %}
<section class="pagina">
    <div class="titulo">
        <span class="tag">CADASTRO</span>
        <h1>Preencha seus dados</h1>
        <p>Informe os dados abaixo para realizar um novo cadastro.</p>
    </div>

    {% if mensagem %}
    <div class="mensagem">{{ mensagem }}</div>
    {% endif %}

    <form method="POST" class="formulario">
        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
            </div>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seuemail@email.com" required>
        </div>

        <div class="campo">
            <label for="genero">Gênero</label>
            <select id="genero" name="genero" required>
                <option value="">Selecione</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
                <option value="Outro">Outro</option>
                <option value="Prefiro não informar">Prefiro não informar</option>
            </select>
        </div>

        <button type="submit" class="botao">Cadastrar</button>
    </form>
</section>
{% endblock %}
